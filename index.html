<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To Doリスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4e6ea;          /* 方眼の地の色 */
    --grid: #fbf5f7;        /* 方眼の線 */
    --green: #4dbd8f;       /* タイトルとチェックの緑 */
    --box: #8fd3bf;         /* チェックの枠 */
    --ink: #5a5689;         /* 文字の色 */
    --star: #fbf3a8;        /* 星の色 */
    --star-line: #5c6b8a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    color: var(--ink);
    background-color: var(--bg);
    /* 方眼の背景 */
    background-image:
      linear-gradient(var(--grid) 2px, transparent 2px),
      linear-gradient(90deg, var(--grid) 2px, transparent 2px);
    background-size: 28px 28px;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  .sheet {
    position: relative;
    width: 100%;
    max-width: 560px;
  }

  /* 見出し */
  .lead {
    text-align: center;
    font-weight: 800;
    font-size: clamp(15px, 4vw, 19px);
    letter-spacing: 0.08em;
    margin: 44px 0 4px;
  }
  h1 {
    margin: 0 0 20px;
    text-align: center;
    font-weight: 800;
    font-size: clamp(48px, 15vw, 84px);
    line-height: 1.1;
    color: #fff;
    letter-spacing: 0.02em;
    /* 緑の太い縁取りと、少し下にずらした影 */
    -webkit-text-stroke: 10px var(--green);
    paint-order: stroke fill;
    text-shadow: 0 5px 0 #3a9f74;
  }

  /* 表 */
  .head {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0 0 8px 8px;
    font-weight: 800;
    font-size: clamp(20px, 5.5vw, 26px);
    color: #fff;
    -webkit-text-stroke: 6px var(--green);
    paint-order: stroke fill;
  }
  .head .mark {
    width: 30px; height: 30px; border-radius: 4px;
    background: var(--green);
    display: grid; place-items: center;
    -webkit-text-stroke: 0;
    font-size: 22px;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: stretch;
    gap: 12px;
    margin-bottom: 14px;
  }
  .check {
    flex: none;
    width: 52px; height: 52px;
    border: 4px solid var(--box);
    background: #fff;
    border-radius: 3px;
    cursor: pointer;
    display: grid; place-items: center;
    padding: 0;
  }
  .check svg { width: 34px; height: 34px; opacity: 0; transform: scale(0.6); transition: 0.15s; }
  li.done .check svg { opacity: 1; transform: scale(1); }
  .label {
    flex: 1;
    min-width: 0;
    background: #fff;
    display: flex;
    align-items: center;
    padding: 0 14px;
    font-weight: 800;
    font-size: clamp(15px, 4.2vw, 18px);
    letter-spacing: 0.06em;
    outline: none;
    border-radius: 2px;
    word-break: break-all;
  }
  .label:focus { box-shadow: inset 0 0 0 2px var(--box); }
  li.done .label { color: #a9a6c8; text-decoration: line-through; text-decoration-thickness: 2px; }

  /* 下のボタンとメッセージ */
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 12px; flex-wrap: wrap; }
  .count { font-weight: 800; }
  .reset {
    font: inherit; font-weight: 800; color: var(--ink);
    background: #fff; border: 3px solid var(--box); border-radius: 999px;
    padding: 6px 18px; cursor: pointer;
  }
  .hanamaru {
    text-align: center; font-weight: 800; font-size: clamp(18px, 5vw, 24px);
    margin-top: 16px; min-height: 1.5em; color: #e07a9b;
  }
  .hint { text-align: center; font-size: 12px; opacity: 0.8; margin: 6px 0 36px; }

  /* 飾りの星(自作の SVG) */
  .star { position: absolute; width: 28px; height: 28px; pointer-events: none; }
  .star.s { width: 18px; height: 18px; }
  .star.l { width: 36px; height: 36px; }
</style>
</head>
<body>
<main class="sheet">
  <!-- 飾りの星。文字や枠に重ならないよう、上と下の余白にだけ置く -->
  <svg class="star l" style="top:2px; right:8%" viewBox="0 0 24 24"><use href="#star"/></svg>
  <svg class="star s" style="top:10px; right:22%" viewBox="0 0 24 24"><use href="#star"/></svg>
  <svg class="star" style="top:6px; left:8%" viewBox="0 0 24 24"><use href="#star"/></svg>
  <svg class="star s" style="top:22px; left:20%" viewBox="0 0 24 24"><use href="#star"/></svg>
  <svg class="star" style="bottom:0; right:10%" viewBox="0 0 24 24"><use href="#star"/></svg>
  <svg class="star s" style="bottom:4px; left:12%" viewBox="0 0 24 24"><use href="#star"/></svg>

  <p class="lead">できたら、じぶんに花まる◎</p>
  <h1>To Doリスト</h1>

  <div class="head"><span class="mark">✓</span>やること</div>
  <ul id="list"></ul>

  <div class="foot">
    <span class="count" id="count"></span>
    <button class="reset" id="reset" type="button">チェックを全部外す</button>
  </div>
  <p class="hanamaru" id="hanamaru"></p>
  <p class="hint">四角を押すとチェック。文字は押すと書き換えられます(このブラウザに保存されます)</p>
</main>

<!-- 星とチェックの形 -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="star" viewBox="0 0 24 24">
      <path d="M12 2.5l2.7 6 6.5.6-4.9 4.3 1.5 6.4L12 16.5l-5.8 3.3 1.5-6.4L2.8 9.1l6.5-.6z"
            fill="#fbf3a8" stroke="#5c6b8a" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<script>
  // はじめに並べるやること
  const DEFAULT_ITEMS = [
    "買い物", "片づけ", "水分補給", "やること整理", "明日の準備",
    "洗濯", "ゴミ出し", "作り置きを作る", "しのちゃんにメッセージ", "ヨガ",
  ];
  const STORAGE_KEY = "todo-list-v1";

  const CHECK_SVG = '<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#4dbd8f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // 保存した状態を読む。読めなければ、はじめの状態にする
  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(saved) && saved.length) return saved;
    } catch (e) { /* 保存が使えないブラウザでも動くようにする */ }
    return DEFAULT_ITEMS.map(text => ({ text, done: false }));
  }

  function save(items) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch (e) {}
  }

  const items = load();
  const list = document.getElementById("list");

  function render() {
    list.innerHTML = "";
    items.forEach((item, i) => {
      const li = document.createElement("li");
      if (item.done) li.classList.add("done");

      const button = document.createElement("button");
      button.className = "check";
      button.type = "button";
      button.setAttribute("aria-label", item.text + " をチェック");
      button.setAttribute("aria-pressed", item.done);
      button.innerHTML = CHECK_SVG;
      button.addEventListener("click", () => {
        item.done = !item.done;
        save(items);
        render();
      });

      const label = document.createElement("div");
      label.className = "label";
      label.contentEditable = "true";
      label.spellcheck = false;
      label.textContent = item.text;
      label.addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); label.blur(); }
      });
      label.addEventListener("blur", () => {
        item.text = label.textContent.trim();
        save(items);
      });

      li.append(button, label);
      list.append(li);
    });
    updateSummary();
  }

  function updateSummary() {
    const done = items.filter(x => x.done).length;
    document.getElementById("count").textContent = `${done} / ${items.length} できた`;
    document.getElementById("hanamaru").textContent =
      done === items.length ? "ぜんぶできた！ 花まる ◎" : "";
  }

  document.getElementById("reset").addEventListener("click", () => {
    items.forEach(x => { x.done = false; });
    save(items);
    render();
  });

  render();
</script>
</body>
</html>
